top_videos:
  count: 20
  sort_by: "view_count"     # view_count | like_count | upload_date | duration
  min_view_count: 20000
  include_shorts: false
  max_duration_seconds: 7200
  flat_extract: true

subtitles:
  languages: ["en"]
  prefer_manual: false
  download_auto: true
  format: "vtt"

output:
  base_dir: "./out"
  filename_template: "%(channel)s/%(title)s [%(id)s]/%(title)s [%(id)s].%(ext)s"

runtime:
  concurrency: 30
  retries: 3
  verbose: false