channels:
  - "https://www.youtube.com/@redditdramatale/videos"

top_videos:
  count: 10
  sort_by: "view_count"     # view_count | like_count | upload_date | duration
  min_view_count: 0
  include_shorts: false
  min_duration_seconds: 0    # 0 = no minimum
  max_duration_seconds: 7200
  flat_extract: true

subtitles:
  languages: ["en"]
  prefer_manual: false
  download_auto: true
  format: "vtt"

audio:
  enabled: false
  format: "mp3"                       # mp3 | wav | m4a | opus
  quality: "192"                      # bitrate in kbps (e.g. 128, 192, 320)

output:
  base_dir: "./out"
  shorts_subdir: "shorts"
  regular_subdir: "regular"
  filename_template: "%(channel)s/%(title)s [%(id)s]/%(title)s [%(id)s].%(ext)s"

runtime:
  concurrency: 4
  retries: 3
  verbose: false